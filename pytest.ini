[tool:pytest]
# Pytest configuration for Headquarters Finder

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output and coverage options
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10
    --maxfail=10
    --cov=headquarters_finder
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --cov-branch
    --cov-source=headquarters_finder

# Logging options
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    edge_case: Edge case tests for boundary conditions
    golden_path: Golden path tests for normal operation
    slow: Slow running tests
    api: Tests that require API access
    file: Tests that require file system access
    network: Tests that require network access
    memory: Tests that require significant memory
    performance: Performance tests
    security: Security tests
    regression: Regression tests
    smoke: Smoke tests for basic functionality
    acceptance: Acceptance tests for user scenarios

# Filtering options
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
    ignore::ResourceWarning

# Test collection options
collect_ignore = setup.py build dist *.egg-info venv .venv env .env

# Minimum version requirements
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Parallel execution
# -n auto  # Requires pytest-xdist plugin

# Test discovery patterns
norecursedirs = .git .tox dist build *.egg .venv venv env .env

# Test execution options
cache_dir = .pytest_cache
junit_family = xunit2
junit_logging = all
junit_log_passing_tests = true

# Plugin options
# --html=test-report.html --self-contained-html
# --junitxml=test-results.xml
# --cov-report=html:htmlcov
# --cov-report=xml:coverage.xml
